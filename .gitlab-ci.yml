stages:
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

build:
  stage: build
  image: node:lts-bookworm-slim
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
  when: manual

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r dist/* public
  artifacts:
    paths:
      - public
  only:
    - main
  when: manual