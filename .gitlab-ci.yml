stages:
    - build
    - test
    - deploy

cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
        - node_modules/

build:
    stage: build
    image: node:lts-bookworm-slim
    script:
        - npm i
        - npm run format
        - npm run build
    artifacts:
        paths:
            - dist/

test-docker:
    stage: test
    image: docker:latest
    services:
        - docker:dind
    dependencies: []
    before_script:
        - apk add --no-cache docker-compose git git-lfs openssh-client
        - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.dit.htwk-leipzig.de/".insteadOf "git@gitlab.dit.htwk-leipzig.de:"
        - git lfs install --skip-repo
        - git lfs pull
        - git submodule sync
        - git submodule update --init --recursive
        - docker network create activate-network || true
        - echo "=== Files in rdflib/data/backup ===" && find rdflib/data/backup -name "*.ttl" -type f 2>/dev/null | wc -l
    script:
        - docker compose build 2>&1 | tail -50
        - docker compose up -d
        - sleep 10
        - echo "=== Inside Container Check ===" && docker exec activate-dashboard-backend-1 ls -la /app/data/backup/ 2>&1 || echo "Cannot access container data"
        - docker compose ps
        - |
            FAILED_CONTAINERS=$(docker compose ps --format json | grep -v '"State":"running"' || true)
            if [ ! -z "$FAILED_CONTAINERS" ]; then
                echo "ERROR: Some containers are not running properly!"
                echo "$FAILED_CONTAINERS"
                for container in $(docker compose ps --format '{{.Name}}'); do
                    echo ">>> Logs for $container <<<"
                    docker logs $container --tail 100
                done
                exit 1
            fi
        - sleep 10
        - docker compose ps
        - |
            RESTARTED=$(docker compose ps --format json | grep '"State":"restarting"' || true)
            if [ ! -z "$RESTARTED" ]; then
                echo "ERROR: Containers are in restart loop!"
                docker compose logs
                exit 1
            fi
    after_script:
        - docker compose down -v || true

deploy:
    stage: deploy
    only:
        - prod
    script:
        - mkdir -p ~/.ssh
        - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        - chmod 600 ~/.ssh/id_ed25519
        - eval "$(ssh-agent -s)"
        - ssh-add ~/.ssh/id_ed25519
        - ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts
        # Check git availability
        - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "echo PATH=\$PATH && which git && git --version"
        # Run deploy commands step-by-step with debug output
        - |
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST bash -lc "
            set -ex
            cd /home/projekt/infrastructure/apps/activate-dashboard
            echo '=== Running git pull ==='
            git pull origin prod
            echo '=== Running submodule update ==='
            git submodule update --init --recursive
            echo '=== Running task create ==='
            task create
            echo '=== Running reload-nginx ==='
            task reload-nginx
            echo '=== Deploy completed successfully ==='
            "
