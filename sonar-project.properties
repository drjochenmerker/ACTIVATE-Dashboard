# Projekt-Identifier in SonarQube
sonar.projectKey=activate

# Projektname (wird im Dashboard angezeigt)
sonar.projectName=ACTIVATE

# Quellcode-Ordner (relativ zum Projektroot)
sonar.sources=src

# Encoding der Quellcodedateien
sonar.sourceEncoding=UTF-8

# JavaScript: nur .js und .jsx
sonar.lang.patterns.js=**/*.js,**/*.jsx

# TypeScript + Vue-SFC: .ts, .tsx und .vue
sonar.lang.patterns.ts=**/*.ts,**/*.tsx,**/*.vue

# (optional, aber zur Sicherheit) die file-suffixes synchron halten
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx,.vue

# Pfad zur TypeScript-Konfigurationsdatei
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage-Report-Pfad (wenn Tests mit Coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Dateien/Ordner ausschließen (Tests, node_modules, Build-Ordner)
sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/*.spec.{js,ts},\
**/__tests__/**,\
**/src/components/ui/**/*

# Authentifizierungstoken (ersetze durch deinen Token)
